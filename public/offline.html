<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hors ligne</title>
    <style>
        :root { color-scheme: light dark; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            background: #f8fafc;
            color: #0f172a;
        }
        .card {
            max-width: 28rem;
            margin: 1rem;
            border: 1px solid #cbd5e1;
            border-radius: 14px;
            padding: 1.1rem 1rem;
            background: white;
            box-shadow: 0 6px 20px rgba(15, 23, 42, 0.08);
        }
        h1 { margin: 0 0 0.35rem; font-size: 1.15rem; }
        p { margin: 0; color: #334155; }
    </style>
</head>
<body>
    <section class="card">
        <h1>Application hors ligne</h1>
        <p>La connexion est indisponible. Nouvelle tentative automatique dans quelques secondes…</p>
    </section>
    <script>
        // Kiosk screens are unattended: keep retrying until the network comes back.
        setInterval(() => { if (navigator.onLine) location.reload() }, 20000);
        window.addEventListener('online', () => location.reload());
    </script>
</body>
</html>
