# Builds the production image, publishes it to GitHub Container Registry and creates the
# matching GitHub release when a version tag is pushed, e.g.:  git tag 1.2.0 && git push origin 1.2.0
name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  image:
    name: Build & push image
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Image name (registries require lowercase)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags & labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub release
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Write release notes
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          image="ghcr.io/${REPO,,}"
          previous=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -vx "$TAG" | head -n1 || true)
          range=${previous:+$previous..}$TAG
          {
            echo "## What's changed"
            echo
            git log "$range" --no-merges --pretty='- %s (%h)'
            echo
            echo "## Docker image"
            echo
            echo '```bash'
            echo "docker pull $image:$TAG"
            echo '```'
            echo
            echo "Also tagged \`${TAG%.*}\` and \`latest\`."
            if [ -n "$previous" ]; then
              echo
              echo "**Full changelog:** https://github.com/$REPO/compare/$previous...$TAG"
            fi
          } > notes.md
          cat notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file notes.md --latest
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag --latest
          fi
